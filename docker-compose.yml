version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trustmesh-db
    environment:
      POSTGRES_USER: trustmesh_user
      POSTGRES_PASSWORD: trustmesh_password
      POSTGRES_DB: trustmesh_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trustmesh-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./backend
    container_name: trustmesh-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: trustmesh_db
      DB_USER: trustmesh_user
      DB_PASSWORD: trustmesh_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: super-secure-jwt-secret-key-12345678
      JWT_ISSUER: http://localhost:8080/
      JWT_AUDIENCE: http://localhost:8080/
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_placeholder}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-rzp_secret_placeholder}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
